# =============================================================================
# GitHub Actions CI
#
# 三个 job 各自回答一个不同的问题，故意不合成一个：
#   unit        —— 「纯逻辑有没有被改坏」。不配任何 service，这是它最有价值的地方：
#                   跑得快（本地实测 12.7 秒，含编译），且**任何环境都能跑通**。
#                   这一层存在的全部意义就是「不需要 MySQL/Redis 也能验证 49 个用例」，
#                   一旦给它加上 service，它就退化成另一个集成测试了。
#   migration   —— 「迁移脚本能不能真的执行」。这是 unit job 永远发现不了的一类坏：
#                   SQL 写错、条件判断漏一种存量状态、ngram 参数不对 —— 都在运行时才炸。
#   build       —— 「能不能出包」。
#
# ⚠ 为什么没有 docker job：本仓库的 Dockerfile/compose **没有在带 Docker 的 runner 上验证过**
#   （作者的机器没装 Docker）。所以这里只跑 `docker compose config` 做**语法校验**，
#   不去 build —— 把一个没验证过的构建写进 CI，得到的第一个红通常和被测的那件事无关。
# =============================================================================

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# 同一分支的新提交进来就取消上一次：这个仓库的 CI 只有一条 mvn test，
# 排队跑完一个已经过时的 commit 纯属浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  unit:
    name: 单元测试（无中间件）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 用 JDK 17 并缓存 ~/.m2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 用仓库里的 mvnw 而不是 runner 自带的 mvn：runner 装的版本会随镜像更新漂移，
      # 而 mvnw + maven-wrapper.properties 把版本钉在 3.9.16 ——
      # 「在我机器上是绿的」有一半是这个原因
      - name: mvnw test
        run: ./mvnw -B test

      - name: 失败时保留测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  migration:
    name: 迁移脚本可在真实 MySQL 上执行
    runs-on: ubuntu-latest
    services:
      mysql:
        # 8.0 而不是 latest：V4 的 CHECK 依赖 8.0.16+，把上限钉住比追新稳妥
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only_not_a_secret
          MYSQL_DATABASE: campus_trade
        # ⚠ 这一行是整个 job 的前提：ngram_token_size 默认 6，
        # 不传的话 V2 会**按设计**失败（它主动去 SELECT 一张不存在的表把问题顶出来）。
        # 也就是说这个参数错不只是一个 bug，它还会让 V2 的守卫在 CI 上生效 —— 这正是想要的
        args: >-
          --ngram_token_size=2
          --default-authentication-plugin=mysql_native_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_only_not_a_secret --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_ROOT_PW: ci_only_not_a_secret
    steps:
      - uses: actions/checkout@v4

      - name: 等 MySQL 真的能查（service 的 healthcheck 通过后仍可能差一秒）
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h "$DB_HOST" -P "$DB_PORT" -uroot -p"$DB_ROOT_PW" --silent; then exit 0; fi
            sleep 2
          done
          echo 'MySQL 未就绪' >&2; exit 1

      - name: 确认 ngram_token_size 已经是 2
        run: |
          mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -p"$DB_ROOT_PW" -N -B -e \
            "SELECT VARIABLE_VALUE FROM performance_schema.global_variables WHERE VARIABLE_NAME='ngram_token_size';" \
            | tee /tmp/nts.txt
          grep -qx '2' /tmp/nts.txt

      # 第一轮：证明**新库**能从头建出来
      - name: 依次执行 V1 ~ V4（空库路径）
        run: |
          for f in $(ls src/main/resources/db/migration/V*.sql | sort -V); do
            echo "::group::$f"
            mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -p"$DB_ROOT_PW" --database=campus_trade < "$f"
            echo "::endgroup::"
          done

      # 第二轮：这是这个 job 里唯一**不可替代**的一步。
      # 迁移脚本里那些 information_schema 判断，只有在「对象已经存在」的库上再跑一次
      # 才算被验证过；只跑第一轮等于只测了 else 分支，而线上出问题的从来是 already-present 分支
      - name: 再执行一遍（幂等路径，任何一条报错都说明对应的守卫没写全）
        run: |
          for f in $(ls src/main/resources/db/migration/V*.sql | sort -V); do
            echo "::group::re-run $f"
            mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -p"$DB_ROOT_PW" --database=campus_trade < "$f"
            echo "::endgroup::"
          done

      - name: 校验最终结构确实长出来了
        run: |
          mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -p"$DB_ROOT_PW" campus_trade -e "
            SELECT 'tables' AS what, COUNT(*) AS n FROM information_schema.tables
              WHERE table_schema='campus_trade'
                AND table_name IN ('user','category','goods','comment','collect',\`order\`,'notice','report','oper_log')
            UNION ALL SELECT 'goods ft index', COUNT(DISTINCT index_name) FROM information_schema.statistics
              WHERE table_schema='campus_trade' AND table_name='goods' AND index_name='ft_goods_title'
            UNION ALL SELECT 'goods composite idx', COUNT(DISTINCT index_name) FROM information_schema.statistics
              WHERE table_schema='campus_trade' AND table_name='goods' AND index_name='idx_goods_status_create'
            UNION ALL SELECT 'legacy single idx (must be 0)', COUNT(DISTINCT index_name) FROM information_schema.statistics
              WHERE table_schema='campus_trade' AND table_name='goods' AND index_name='idx_goods_status'
            UNION ALL SELECT 'categories seeded', COUNT(*) FROM category;"
          # 九张表 + 全文索引 + 联合索引 + 老索引已删 + 六个分类，逐项断言而不是靠人看输出
          test "$(mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -p"$DB_ROOT_PW" -N -B campus_trade -e \
                  "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='campus_trade' AND table_name IN ('user','category','goods','comment','collect','order','notice','report','oper_log');")" = 9
          test "$(mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -p"$DB_ROOT_PW" -N -B campus_trade -e \
                  "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='campus_trade' AND table_name='goods' AND index_name='ft_goods_title';")" = 1
          test "$(mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -p"$DB_ROOT_PW" -N -B campus_trade -e \
                  "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='campus_trade' AND table_name='goods' AND index_name='idx_goods_status';")" = 0
          test "$(mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -p"$DB_ROOT_PW" -N -B campus_trade -e \
                  "SELECT COUNT(*) FROM category;")" -ge 6

      - name: 中文全文检索真的能命中（这条才是 P3-2 的验收）
        run: |
          mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -p"$DB_ROOT_PW" campus_trade -e "
            INSERT INTO user (username,password,role) VALUES ('ci_probe','x','user');
            INSERT INTO category (name,sort) VALUES ('CI临时分类',999) AS seed
              ON DUPLICATE KEY UPDATE sort=seed.sort;
            INSERT INTO goods (user_id,category_id,title,price)
              VALUES (LAST_INSERT_ID(), (SELECT id FROM category WHERE name='CI临时分类'), '四级词汇 教材', 12.00);
            SELECT 'MATCH +教材* 命中数' AS check_name,
                   (SELECT COUNT(*) FROM goods WHERE MATCH(title) AGAINST('+教材*' IN BOOLEAN MODE)) AS hit;"
          # 0 命中有两种原因：索引没建上（会在这里暴露），或者 ngram 词长不是 2
          test "$(mysql -h "$DB_HOST" -P "$DB_PORT" -uroot -p"$DB_ROOT_PW" -N -B campus_trade -e \
                  "SELECT COUNT(*) FROM goods WHERE MATCH(title) AGAINST('+教材*' IN BOOLEAN MODE);")" != 0

  build:
    name: 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvnw package（跳过测试，测试是 unit job 的职责）
        run: ./mvnw -B -DskipTests package
      - name: 校验 compose 文件语法（不是 build）
        # 只 validate 结构，不真的构建镜像：见文件头那条 ⚠
        run: docker compose -f docker-compose.yml config --quiet

  # 这是 L3（Testcontainers）**第一次被真实执行**的地方：作者的机器没有 Docker，
  # 那个文件只做到过 -Pl3 test-compile 通过。ubuntu runner 自带 Docker daemon，
  # 所以这里既是最有价值的一次验证，也是最容易红的一次 —— 因此标了
  # continue-on-error：**故意**让它红了不阻断合入，但红了必须去看。
  # 它绿过一次之后，就该把 continue-on-error 删掉，让它变成真的门槛。
  integration:
    name: L3 集成测试（需要 Docker）
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvnw -Pl3 test
        # -Dtest 指名道姓，让这个 job 只跑 L3：unit 那 49 条已经由 unit job 跑过了，
        # 在这里重复一遍只会把「L3 到底坏在哪」混进一大段已经绿过的输出里
        run: ./mvnw -B -Pl3 test -Dtest=MysqlMigrationAndFulltextIT
      - name: 失败时保留 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: it-reports
          path: target/surefire-reports/
