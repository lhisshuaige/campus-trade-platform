server:
  port: 8080

spring:
  application:
    name: CampusTrade
  # 默认激活 local，从而加载本地私有配置 application-local.yaml（该文件已被 gitignore，不入库）
  # 部署时可用命令行/环境变量覆盖：--spring.profiles.active=prod 或 SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/campus_trade?allowMultiQueries=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 配置Redis（密码等敏感值放到 application-local.yaml）
  data:
    redis:
      host: ${REDIS_HOST:192.168.88.128}
      port: ${REDIS_PORT:6379}
      database: 3
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  # RabbitMQ：订单超时未确认自动取消
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated   #只保证到达 broker，不保证消费成功，所以仍需兜底扫描
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        #失败不重回队头：否则一条毒消息会把消费者打死循环，必须走 DLX 人工处理
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
        #本机没装 MQ 时设为 false，消费者不启动，不刷重连日志
        auto-startup: ${MQ_LISTENER_AUTO_STARTUP:true}

mybatis-plus:
  type-aliases-package: com.campus.trade.bean.entry
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰自动转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #打印SQL

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

upload:
  path: ${UPLOAD_PATH:D:/upload/campus-trade/}

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    enabled: true
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.campus.trade.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

app:
  order-timeout:
    minutes: 30                    #下单后多久未确认自动取消（同时用于队列 TTL）
    scan-interval-ms: 300000       #兜底扫描间隔
    mq-enabled: true               #false = 不发延迟消息，完全靠兜底扫描
