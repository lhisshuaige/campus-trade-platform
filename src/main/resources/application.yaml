server:
  port: 8080

# ============================================================================
# 健康探针（P3-17）。分组的唯一依据是「探针失败后编排器该做什么」：
#   liveness 失败 = 这个进程救不回来，杀掉重启；
#   readiness 失败 = 先别给这个实例接流量，等它自己恢复。
# 所以 Redis/MQ 这类**可自愈**的降级只能进 readiness：Redis 抖一下时把实例重启，
# 重启后的应用会去重新建连、重新拉缓存，一群同时重启的实例正好把 Redis 打成惊群 ——
# 把一个能降级的故障做成了雪崩。而 liveness 只留进程自身的两个状态，
# 它们失败的成因确实只有「这个 JVM 不行了」。
#
# ⚠ 探针路径必须同时从 JwtInterceptor 和 Security 两条路上放行，少一条都是 401：
#   WebMvcConfig 里已经 exclude("/actuator/**")；SecurityConfig 现在是 anyRequest().permitAll()，
#   将来谁把鉴权收进 Security 链，记得在这里加 permitAll，否则症状是「容器反复重启」而不是「探针不通」。
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        # 只给 health/info。metrics/env/configprops 能读到配置项名与运行时指标，
        # 而本站现在没有任何消费方需要它们：暴露面少一个就少一个
        include: health,info
  info:
    env:
      # 关掉 /actuator/info 对环境变量的回显（它能把 DB_PASSWORD 的**变量名**与默认值列出来）
      enabled: false
  endpoint:
    health:
      # never：现在 Security 是全放行，「仅鉴权后可见」等于「永远不可见」，写 when_authorized 是一个谎言。
      # 本地排查想要明细时用命令行覆盖，不改仓库里的值：
      #   --management.endpoint.health.show-details=always
      show-details: never
      show-components: never
      probes:
        # 打开 /actuator/health/liveness 与 /readiness 两个路径（K8s 标准探针端点）
        enabled: true
      group:
        liveness:
          # 只有这两个：不连 DB、不连 Redis、不看磁盘
          include: livenessState,ping
        readiness:
          # db：连不上库等于什么都写不了；redis/redisCircuit：缓存不可用会让下单直接 503；
          # rabbit：MQ 是软依赖（关掉消费者后还有定时任务作后备），但队列真不可用时新订单的延迟取消会失效，
          # 这个阶段不该接流量；diskSpace：上传目录写不进去是真实故障，而且不报错、只静默失败。
          # ⚠ 这里的每一项在本地都会把 readiness 拖成 DOWN（没起 Redis 就是 DOWN），
          # 这是**正确行为**：本地没有编排器拿它去重启容器，只是 curl 一下会看到 down
          include: readinessState,db,redis,redisCircuit,rabbit,diskSpace

spring:
  application:
    name: CampusTrade
  # 默认激活 local，从而加载本地私有配置 application-local.yaml（该文件已被 gitignore，不入库）
  # 部署时可用命令行/环境变量覆盖：--spring.profiles.active=prod 或 SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: local
  datasource:
    # url 也走环境变量：docker-compose 里应用连的是服务名 mysql，不是 localhost，
    # 而之前这个值被写死时，compose 里设的 DB_URL 根本不会被读到（症状是连不上 127.0.0.1:3306）。
    # 默认值仍指向本机，不改本地开发的那条路径
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_trade?allowMultiQueries=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Flyway（P3-15）：迁移脚本在 src/main/resources/db/migration，init.sql 已退役为「只建库」
  flyway:
    enabled: true
    locations: classpath:db/migration
    # ⚠ 这两个 baseline 配置是给**存量库**用的，也是本项目最容易被误读的一对开关：
    #   · 库里已有表、且没有 flyway_schema_history → 按 baseline-version=4 打一条基线，V1~V4 全部跳过
    #     （这就是「我用 init.sql 建的库，不要再给我建一遍」的那个出口）
    #   · 库是空的 → Flyway 不做 baseline，V1~V4 一口气跑完，得到一个与存量库同构的新库
    #   两种情形共用一份配置，这是它比「手工取消注释那段 ALTER」强的全部理由。
    # 代价也要写清楚：baseline-version=4 是对「这个库真的到 V4 了」的**信任声明**。
    # 一个缺 oper_log 的老库会被基线跳过、表永远不会被建出来，症状是运行时 500 而不是启动失败。
    # 不信任存量库时的做法：把下面 baseline-on-migrate 改成 false（或 baseline-version 改成 0）跑一次，
    # V1 带 CREATE TABLE IF NOT EXISTS，会跳过已有表、补出缺失表，然后立刻改回来
    baseline-on-migrate: true
    baseline-version: 4
    baseline-description: 该库在引入 Flyway 之前由 db/init.sql 手工建立，V1~V4 视为已应用
    # 已应用的迁移脚本被改动就直接失败，不静默接受。开发时手改过 V1 又忘了，
    # 靠这一条才能在下一次部署前发现，而不是等到两个环境的库行为不一致
    validate-on-migrate: true
    # 关掉 clean：它会 drop 库里全部对象（数据一起没）。「谁都不该在配置里把它打开」
    # 这件事需要一条可读的记录，而不是只靠默认值恰好是 true
    clean-disabled: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 配置Redis（密码等敏感值放到 application-local.yaml）
  data:
    redis:
      host: ${REDIS_HOST:192.168.88.128}
      port: ${REDIS_PORT:6379}
      database: 3
      password: ${REDIS_PASSWORD:}
      # 命令超时：熔断开路后只有"半开试探"那一次会用到它，压到 1s 让试探也别拖久
      timeout: 1000ms
      # 连接超时：黑洞型故障（IP 不通/防火墙丢包）真正决定快慢的是这个，Lettuce 默认值偏大
      connect-timeout: 1000ms
  # RabbitMQ：订单超时未确认自动取消
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated   #只保证到达 broker，不保证消费成功，所以仍需兜底扫描
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        #失败不重回队头：否则一条毒消息会把消费者打死循环，必须走 DLX 人工处理
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
        #本机没装 MQ 时设为 false，消费者不启动，不刷重连日志
        auto-startup: ${MQ_LISTENER_AUTO_STARTUP:true}
  # 邮箱验证码发信（注册防恶意）。默认全空 = 只有 app.mail.enabled=true 时才会真正连 SMTP，
  # dev 模式（默认 false）验证码只进日志，不碰外部服务。真实凭据放 application-local.yaml/环境变量
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          # 发信在注册请求线程里，SMTP 对端抽风不能把接口挂死：读写都设死线
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mybatis-plus:
  type-aliases-package: com.campus.trade.bean.entity
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰自动转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #打印SQL

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

upload:
  path: ${UPLOAD_PATH:D:/upload/campus-trade/}
  # 图片对外基地址，例：https://img.example.com。留空 = 从请求自身推断（只适合本机直连）。
  # 反代/负载均衡后必须配：request.getServerName() 拿到的是内部地址，用户浏览器打不开，
  # 而这个 URL 会存进 goods.imgUrl 让别的用户去加载 —— 代码里刻意不去信 X-Forwarded-Host（那是客户端可伪造的头）
  base-url: ${UPLOAD_BASE_URL:}
  # 单用户每日上传张数上限。用的是「上传专属」的计数桶，不与登录/登出共用（见 RedisContent.User_Upload_Count_KEY）：
  # 刷满只会不能传图，不会把人锁在系统外
  max-per-user-per-day: 30

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    enabled: true
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.campus.trade.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

app:
  logging:
    # 日志目录（logback-spring.xml 里的 LOG_DIR 读的就是这一项）。
    # 留这一行在仓库里而不是只靠 logback 的 defaultValue，是为了让「日志落在哪」这件事
    # 在配置文件里能被搜到 —— 容器里把它指到挂载卷，否则实例一销毁日志一起没
    dir: ${LOG_DIR:logs}
  cors:
    # 允许的跨域来源，逗号分隔。默认只放本机 = fail-closed：生产忘配时是「前端调不通、立刻被发现」，
    # 而不是「悄悄向全网开着」。放真实域名走这里（或环境变量），不改代码
    # 写法用 allowedOriginPatterns 的语法，支持 http://localhost:* 这种带端口的通配
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
    # 默认关：本站登录态在 Authorization 头里，不依赖 Cookie。
    # 开着它 = 把「浏览器自动携带 cookie」这条通道开给白名单里的每一个来源，
    # 而目前没有任何一个来源需要它；将来真上 Cookie 会话时再按环境打开
    allow-credentials: false
  trade:
    lock-probe-interval-ms: 5000   #后台探测 = 熔断的半开试探者 = Redisson 客户端重建者
  collect-calibration:
    #collect_count 冗余列对账：每天 03:30 用 collect 表回填，单轮限量，避免长事务锁太多行
    cron: "0 30 3 * * ?"
    batch-size: 500
  view-count:
    #浏览量增量从 Redis 搬进 goods.view_count 的间隔（5 分钟）
    #这个值同时决定列表页浏览量的最大滞后量：调太长列表数字明显偏低，调太短就是拿 DB 写换显示精度
    flush-interval-ms: 300000
    #单轮最多处理多少个商品：极端流量下不把几万条 UPDATE 压成一次长循环，剩余增量下一轮继续
    max-per-round: 2000
  order-timeout:
    minutes: 30                    #下单后多久未确认自动取消（同时用于队列 TTL）
    scan-interval-ms: 300000       #兜底扫描间隔
    mq-enabled: true               #false = 不发延迟消息，完全靠兜底扫描
  auth:
    # Redis 故障、黑名单读不出来时的降级方向：true=放行保可用（默认），false=拒绝保安全
    blacklist-fail-open: true
    # 每日登录+登出总量上限（防脚本滥用）
    login-logout-max-per-day: 100
    # 连续登录失败达到几次即锁定账号（防撞库，判定在密码校验之前）
    login-fail-max: 5
    # 账号锁定时长（分钟）= 失败计数的 Redis TTL，到期自动解锁，无需定时任务
    login-lock-minutes: 15
  rate-limit:
    # @RateLimit 总开关（P2-11）：本地压测/演示时一把关掉，不必改代码
    enabled: true
    # Redis 异常/熔断判不出来时走本地令牌桶继续限流，而不是直接放行。
    # 这一项就是「限流 fail-open」那个老口径的补丁：关掉 = 回到「Redis 挂了就等于没限流」
    local-fallback: true
    # IP 维度默认用连接地址而不是 X-Forwarded-For：XFF 是客户端可伪造的请求头，
    # 拿它当限流 key 等于攻击者在头里换一个值就能绕过整层限流。
    # 与 FileController 不回退读 X-Forwarded-Host 是同一条纪律（只有 LogAspect 读 XFF 当排查线索，不参与判定）
    use-forwarded-for: false
  redis:
    # false=Redis 不可用时照常启动并降级运行（本地/演示友好）；true=启动探测失败即拒绝启动（生产建议）
    required: false
  search:
    # 商品标题搜索走 MySQL FULLTEXT(ngram) 还是 LIKE '%kw%'（P3-2）。
    # true（默认）= MATCH(title) AGAINST(... IN BOOLEAN MODE)，能走倒排索引，但硬前置是
    # goods 上已经建上 ft_goods_title（由 Flyway 的 V2__goods_title_fulltext.sql 负责，见上一段）；
    # 没建上不会「静默回到慢路径」，而是搜索接口直接 500（MySQL 1191）——刻意选这个方向：
    # 静默回退等于「上了全文索引」这件事永远没人发现。跑不了 DDL 的环境翻成 false 即可
    # （两个失败方向与代价的完整推演见 GoodsServiceImpl.fulltextEnabled）
    fulltext-enabled: ${APP_SEARCH_FULLTEXT:true}
  content:
    #UGC 审核总开关：批量灌数据/演示时可临时关掉，不必为造数据先想一套“不含敏感词”的说法
    audit-enabled: true
    #敏感词表，逗号分隔，例："代刷,幽灵商品,加微信付款"；
    #留空 = 只依长度拦不依词表拦（不把一套假词库当代码的一部分，词表要随治理口径变）
    sensitive-words: ""
  mail:
    # false = 验证码只打日志不发信（本地/演示默认，链路可全流程验证）；
    # true = 真实 SMTP 发送，需要 spring.mail.host/username/password 三个环境变量就位
    enabled: ${MAIL_ENABLED:false}
    # 发件人显示名，留空回退 spring.mail.username（QQ/163 要求 from == 登录账号，别乱填）
    from: ${MAIL_FROM:}
  email-code:
    # 验证码在 Redis 的存活时长（分钟）：到期由 Redis 自动清理，不写定时任务
    ttl-minutes: 5
    # 同一邮箱两次发码的最小间隔（SETNX 冷却 key 的 TTL），挡住「按住重发」烧额度
    resend-cooldown-seconds: 60
    # 同一邮箱当日发码上限（桶在 RedisContent.Email_Code_Daily_KEY，与登录/上传桶分开的道理相同）
    daily-limit: 10
    # 验证连续输错达到此次数即删码作废：6 位码只有 100 万组合，不设错次上限等于给人慢慢猜
    max-verify-fail: 5
