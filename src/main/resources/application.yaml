server:
  port: 8080

spring:
  application:
    name: CampusTrade
  # 默认激活 local，从而加载本地私有配置 application-local.yaml（该文件已被 gitignore，不入库）
  # 部署时可用命令行/环境变量覆盖：--spring.profiles.active=prod 或 SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/campus_trade?allowMultiQueries=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 配置Redis（密码等敏感值放到 application-local.yaml）
  data:
    redis:
      host: ${REDIS_HOST:192.168.88.128}
      port: ${REDIS_PORT:6379}
      database: 3
      password: ${REDIS_PASSWORD:}
      # 命令超时：熔断开路后只有"半开试探"那一次会用到它，压到 1s 让试探也别拖久
      timeout: 1000ms
      # 连接超时：黑洞型故障（IP 不通/防火墙丢包）真正决定快慢的是这个，Lettuce 默认值偏大
      connect-timeout: 1000ms
  # RabbitMQ：订单超时未确认自动取消
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated   #只保证到达 broker，不保证消费成功，所以仍需兜底扫描
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        #失败不重回队头：否则一条毒消息会把消费者打死循环，必须走 DLX 人工处理
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
        #本机没装 MQ 时设为 false，消费者不启动，不刷重连日志
        auto-startup: ${MQ_LISTENER_AUTO_STARTUP:true}

mybatis-plus:
  type-aliases-package: com.campus.trade.bean.entry
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰自动转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #打印SQL

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

upload:
  path: ${UPLOAD_PATH:D:/upload/campus-trade/}
  # 图片对外基地址，例：https://img.example.com。留空 = 从请求自身推断（只适合本机直连）。
  # 反代/负载均衡后必须配：request.getServerName() 拿到的是内部地址，用户浏览器打不开，
  # 而这个 URL 会存进 goods.imgUrl 让别的用户去加载 —— 代码里刻意不去信 X-Forwarded-Host（那是客户端可伪造的头）
  base-url: ${UPLOAD_BASE_URL:}
  # 单用户每日上传张数上限。用的是「上传专属」的计数桶，不与登录/登出共用（见 RedisContent.User_Upload_Count_KEY）：
  # 刷满只会不能传图，不会把人锁在系统外
  max-per-user-per-day: 30

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    enabled: true
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.campus.trade.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

app:
  cors:
    # 允许的跨域来源，逗号分隔。默认只放本机 = fail-closed：生产忘配时是「前端调不通、立刻被发现」，
    # 而不是「悄悄向全网开着」。放真实域名走这里（或环境变量），不改代码
    # 写法用 allowedOriginPatterns 的语法，支持 http://localhost:* 这种带端口的通配
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
    # 默认关：本站登录态在 Authorization 头里，不依赖 Cookie。
    # 开着它 = 把「浏览器自动携带 cookie」这条通道开给白名单里的每一个来源，
    # 而目前没有任何一个来源需要它；将来真上 Cookie 会话时再按环境打开
    allow-credentials: false
  trade:
    lock-probe-interval-ms: 5000   #后台探测 = 熔断的半开试探者 = Redisson 客户端重建者
  collect-calibration:
    #collect_count 冗余列对账：每天 03:30 用 collect 表回填，单轮限量，避免长事务锁太多行
    cron: "0 30 3 * * ?"
    batch-size: 500
  view-count:
    #浏览量增量从 Redis 搬进 goods.view_count 的间隔（5 分钟）
    #这个值同时决定列表页浏览量的最大滞后量：调太长列表数字明显偏低，调太短就是拿 DB 写换显示精度
    flush-interval-ms: 300000
    #单轮最多处理多少个商品：极端流量下不把几万条 UPDATE 压成一次长循环，剩余增量下一轮继续
    max-per-round: 2000
  order-timeout:
    minutes: 30                    #下单后多久未确认自动取消（同时用于队列 TTL）
    scan-interval-ms: 300000       #兜底扫描间隔
    mq-enabled: true               #false = 不发延迟消息，完全靠兜底扫描
  auth:
    # Redis 故障、黑名单读不出来时的降级方向：true=放行保可用（默认），false=拒绝保安全
    blacklist-fail-open: true
    # 每日登录+登出总量上限（防脚本滥用）
    login-logout-max-per-day: 100
    # 连续登录失败达到几次即锁定账号（防撞库，判定在密码校验之前）
    login-fail-max: 5
    # 账号锁定时长（分钟）= 失败计数的 Redis TTL，到期自动解锁，无需定时任务
    login-lock-minutes: 15
  rate-limit:
    # @RateLimit 总开关（P2-11）：本地压测/演示时一把关掉，不必改代码
    enabled: true
    # Redis 异常/熔断判不出来时走本地令牌桶继续限流，而不是直接放行。
    # 这一项就是「限流 fail-open」那个老口径的补丁：关掉 = 回到「Redis 挂了就等于没限流」
    local-fallback: true
    # IP 维度默认用连接地址而不是 X-Forwarded-For：XFF 是客户端可伪造的请求头，
    # 拿它当限流 key 等于攻击者在头里换一个值就能绕过整层限流。
    # 与 FileController 不回退读 X-Forwarded-Host 是同一条纪律（只有 LogAspect 读 XFF 当排查线索，不参与判定）
    use-forwarded-for: false
  redis:
    # false=Redis 不可用时照常启动并降级运行（本地/演示友好）；true=启动探测失败即拒绝启动（生产建议）
    required: false
  search:
    # 商品标题搜索走 MySQL FULLTEXT(ngram) 还是 LIKE '%kw%'（P3-2）。
    # true（默认）= MATCH(title) AGAINST(... IN BOOLEAN MODE)，能走倒排索引，但硬前置是
    # goods 上已经建上 ft_goods_title（见 init.sql 末尾【存量库增量升级 · P3】那一段）；
    # 没建上不会「静默回到慢路径」，而是搜索接口直接 500（MySQL 1191）——刻意选这个方向：
    # 静默回退等于「上了全文索引」这件事永远没人发现。跑不了 DDL 的环境翻成 false 即可
    # （两个失败方向与代价的完整推演见 GoodsServiceImp.fulltextEnabled）
    fulltext-enabled: ${APP_SEARCH_FULLTEXT:true}
  content:
    #UGC 审核总开关：批量灌数据/演示时可临时关掉，不必为造数据先想一套“不含敏感词”的说法
    audit-enabled: true
    #敏感词表，逗号分隔，例："代刷,幽灵商品,加微信付款"；
    #留空 = 只依长度拦不依词表拦（不把一套假词库当代码的一部分，词表要随治理口径变）
    sensitive-words: ""
